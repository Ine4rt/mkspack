<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NEON SURGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <!-- ====== HUD en jeu ====== -->
  <div id="hud" class="layer hidden">
    <div class="hud-top">
      <div class="pill lvl">NIVEAU <b id="hudLevel">1</b></div>
      <div class="pill coins">◈ <b id="hudCoins">0</b></div>
      <button id="btnSound" class="icon-btn" aria-label="Son">♪</button>
    </div>
    <div class="hud-bars">
      <div class="bar enemy"><span id="barEnemy"></span><label>NOYAU ENNEMI</label></div>
      <div class="bar mine"><span id="barMine"></span><label>TON NOYAU</label></div>
    </div>
    <div id="mobCount" class="mob-count">0</div>
    <div class="timer"><span id="barTime"></span></div>
    <div id="hint" class="hint">Glisse le doigt pour déplacer le canon</div>
  </div>

  <!-- ====== Menu principal ====== -->
  <div id="menu" class="layer panel-layer">
    <div class="logo">
      <span class="logo-1">NEON</span><span class="logo-2">SURGE</span>
      <em>déferlante tactique</em>
    </div>
    <div class="menu-stats">
      <div><b id="mCoins">0</b><small>crédits</small></div>
      <div><b id="mLevel">1</b><small>niveau</small></div>
      <div><b id="mBest">1</b><small>record</small></div>
    </div>
    <button id="btnPlay" class="big-btn">JOUER</button>
    <button id="btnShop" class="ghost-btn">AMÉLIORATIONS</button>
  </div>

  <!-- ====== Boutique ====== -->
  <div id="shop" class="layer panel-layer hidden">
    <h2>AMÉLIORATIONS</h2>
    <div class="coins-big">◈ <b id="sCoins">0</b></div>
    <div id="shopList" class="shop-list"></div>
    <button id="btnShopBack" class="ghost-btn">RETOUR</button>
  </div>

  <!-- ====== Fin de manche ====== -->
  <div id="result" class="layer panel-layer hidden">
    <h2 id="resTitle">VICTOIRE</h2>
    <p id="resSub">Noyau ennemi détruit</p>
    <div class="reward"><span>+</span><b id="resCoins">0</b><span>◈</span></div>
    <button id="btnNext" class="big-btn">CONTINUER</button>
    <button id="btnMenu" class="ghost-btn">MENU</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
